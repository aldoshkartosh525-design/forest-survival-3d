name: Compile Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Godot Export Templates
        id: godot-export
        uses: abarrak/godot-action@v1.3.0
        with:
          godot_version: 4.3
          godot_export_templates_version: 4.3

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestSurvival3D-APK
          path: build/android/game.apk
          
